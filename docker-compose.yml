services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expensepilot
      POSTGRES_USER: expensepilot
      POSTGRES_PASSWORD: expensepilot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expensepilot -d expensepilot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://expensepilot:expensepilot@postgres:5432/expensepilot
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  postgres-data:
