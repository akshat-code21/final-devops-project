apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-postgres
  namespace: taskboard
  labels:
    app: taskboard-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskboard-postgres
  template:
    metadata:
      labels:
        app: taskboard-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: taskboard-backend-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: taskboard-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskboard-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: taskboard-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard-postgres
  namespace: taskboard
  labels:
    app: taskboard-postgres
spec:
  type: ClusterIP
  selector:
    app: taskboard-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
