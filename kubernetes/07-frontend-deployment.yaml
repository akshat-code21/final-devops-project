apiVersion: apps/v1
kind: Deployment
metadata:
  name: expensepilot-frontend
  namespace: expensepilot
  labels:
    app: expensepilot-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: expensepilot-frontend
  template:
    metadata:
      labels:
        app: expensepilot-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/akshat-code21/expensepilot-frontend:local-ui-update
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
