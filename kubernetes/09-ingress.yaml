apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: expensepilot-ingress
  namespace: expensepilot
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: expensepilot.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: expensepilot-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: expensepilot-frontend
                port:
                  number: 80
