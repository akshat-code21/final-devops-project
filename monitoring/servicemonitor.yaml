apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: expensepilot-backend-metrics
  namespace: expensepilot
  labels:
    release: prometheus
    app: expensepilot-backend
spec:
  selector:
    matchLabels:
      app: expensepilot-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
