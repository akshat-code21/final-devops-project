{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: expensepilot}
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - {path: /api, pathType: Prefix, backend: {service: {name: {{ include "expensepilot.fullname" . }}-backend, port: {number: 8000}}}}
      - {path: /, pathType: Prefix, backend: {service: {name: expensepilot-frontend, port: {number: 80}}}}
{{- end }}
