apiVersion: apps/v1
kind: Deployment
metadata: {name: expensepilot-frontend, labels: {app: expensepilot-frontend}}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app: expensepilot-frontend}}
  template:
    metadata: {labels: {app: expensepilot-frontend}}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
      - name: frontend
        image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
        imagePullPolicy: {{ .Values.frontend.pullPolicy | default "IfNotPresent" }}
        ports: [{containerPort: 8080}]
        env:
          - name: BACKEND_HOST
            value: '{{ include "expensepilot.fullname" . }}-backend.{{ .Release.Namespace }}.svc.cluster.local'
          - name: DNS_RESOLVER
            value: "10.96.0.10"
        readinessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 5}
        livenessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 10}
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
