apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scenario4-unbound-pvc
  namespace: expensepilot
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: non-existent-aws-ebs-storageclass
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenario4-pending-pod
  namespace: expensepilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scenario4-pending
  template:
    metadata:
      labels:
        app: scenario4-pending
    spec:
      containers:
        - name: app
          image: busybox:latest
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - name: storage
              mountPath: /data
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: scenario4-unbound-pvc
